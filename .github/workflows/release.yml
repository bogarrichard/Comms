name: Release
# Push a tag like v0.1.0 to publish a GitHub release with prebuilt binaries.
# The tag must match [workspace.package] version in Cargo.toml.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version v$version" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - run: python3 -m unittest discover -s tests/scripts
      - run: sh tests/scripts/test_install.sh
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p comms-tui --target ${{ matrix.target }}
      - name: Smoke test
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/comms
          [ "${{ runner.os }}" = Windows ] && bin=$bin.exe
          "$bin" --version
      - name: Package
        shell: bash
        run: |
          name=comms-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          bin=target/${{ matrix.target }}/release/comms
          [ "${{ runner.os }}" = Windows ] && bin=$bin.exe
          cp "$bin" LICENSE README.md "$name"/
          cp -r scripts "$name"/
          if [ "${{ matrix.ext }}" = zip ]; then 7z a "$name.zip" "$name" >/dev/null; else tar czf "$name.tar.gz" "$name"; fi
          if command -v sha256sum >/dev/null; then sha256sum "$name.${{ matrix.ext }}" >"$name.${{ matrix.ext }}.sha256"
          else shasum -a 256 "$name.${{ matrix.ext }}" >"$name.${{ matrix.ext }}.sha256"; fi
          echo "ASSET=$name.${{ matrix.ext }}" >>"$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes $flags
