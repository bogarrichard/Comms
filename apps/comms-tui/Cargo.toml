[package]
name = "comms-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "comms"
path = "src/main.rs"

[features]
default = ["teams", "signal", "slack"]
# Which backends the binary contains (see comms-bootstrap).
teams = ["comms-bootstrap/teams"]
signal = ["comms-bootstrap/signal"]
slack = ["comms-bootstrap/slack"]

[dependencies]
comms-app.workspace = true
comms-bootstrap = { workspace = true, default-features = false }
comms-domain.workspace = true
anyhow.workspace = true
chrono.workspace = true
crossterm.workspace = true
futures.workspace = true
ratatui.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-width.workspace = true

[dev-dependencies]
comms-storage.workspace = true
comms-testkit.workspace = true
