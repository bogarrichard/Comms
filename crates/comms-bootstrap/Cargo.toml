[package]
name = "comms-bootstrap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["teams", "signal", "slack"]
# One feature per backend; a build without one refuses to start it.
teams = ["dep:comms-auth", "dep:comms-provider-msgraph"]
signal = ["dep:comms-provider-signal"]
slack = ["dep:comms-provider-slack", "dep:comms-auth"]

[dependencies]
comms-app.workspace = true
comms-auth = { workspace = true, optional = true }
comms-domain.workspace = true
comms-provider-api.workspace = true
comms-provider-msgraph = { workspace = true, optional = true }
comms-provider-signal = { workspace = true, optional = true }
comms-provider-slack = { workspace = true, optional = true }
comms-storage.workspace = true
comms-testkit.workspace = true
anyhow.workspace = true
directories.workspace = true
serde.workspace = true
toml.workspace = true
url.workspace = true
toml_edit.workspace = true
tokio.workspace = true
tracing.workspace = true
async-trait.workspace = true

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
reqwest.workspace = true
sha2.workspace = true
base64.workspace = true
serde_json.workspace = true
